# ════════════════════════════════════════════════════════════════════════════
# Development Environment Overrides
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ════════════════════════════════════════════════════════════════════════════

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Local Postgres seeded from latest production dump
  # ──────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: whatsapp_postgres_local
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_dev
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
      - ../data_snapshots:/docker-entrypoint-initdb.d/snapshots:ro
    ports:
      - "5433:5432"
    command: >
      bash -c "
        if [ ! -f /docker-entrypoint-initdb.d/snapshots/latest_prod_dump.backup ]; then
          echo '❌ ERROR: Missing data_snapshots/latest_prod_dump.backup.';
          echo '🔧 Run: make dump-prod-db';
          exit 1;
        fi;
        if [ ! -s /docker-entrypoint-initdb.d/snapshots/latest_prod_dump.backup ]; then
          echo '❌ ERROR: data_snapshots/latest_prod_dump.backup is empty.';
          echo '🔧 Run: make dump-prod-db';
          exit 1;
        fi;
        echo '📦 Restoring latest prod dump into local Postgres...';
        pg_restore --clean --no-owner --no-privileges -U postgres -d postgres /docker-entrypoint-initdb.d/snapshots/latest_prod_dump.backup;
        echo '✅ Restore complete. Starting Postgres...';
        exec docker-entrypoint.sh postgres
      "
  # ──────────────────────────────────────────────────────────────────────────
  # Migration Service: Dev overrides
  # ──────────────────────────────────────────────────────────────────────────
  migrate:
    depends_on:
      - db
    build:
      target: dev
    volumes:
      - ../migrations:/app/migrations:ro
      - ../alembic.ini:/app/alembic.ini:ro
    environment:
      - RUN_MIGRATIONS=false

  # ──────────────────────────────────────────────────────────────────────────
  # Miner Service: Dev overrides with hot reload
  # ──────────────────────────────────────────────────────────────────────────
  miner:
    build:
      target: dev
    restart: "no"  # No auto-restart in dev (easier debugging)
    depends_on:
      - db
    volumes:
      - ../src:/app/src  # Hot reload: mount source code
      - ../migrations:/app/migrations:ro
    ports:
      - "8000:8000"  # Expose health endpoint for local testing
      - "${SSH_PORT_MINER:-911}:2222"  # Expose SSH port for PyCharm remote development
    environment:
      - PYTHONUNBUFFERED=1  # Real-time logs
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  # ──────────────────────────────────────────────────────────────────────────
  # Classifier Service: Dev overrides with hot reload
  # ──────────────────────────────────────────────────────────────────────────
  classifier:
    build:
      target: dev
    restart: "no"  # No auto-restart in dev
    depends_on:
      - db
    volumes:
      - ../src:/app/src  # Hot reload: mount source code
      - ../migrations:/app/migrations:ro
    ports:
      - "8001:8001"  # Expose health endpoint for local testing
      - "${SSH_PORT_CLASSIFIER:-912}:2222"  # Expose SSH port for PyCharm remote development
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=true
      - LOG_LEVEL=DEBUG

