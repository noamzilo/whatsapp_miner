# ════════════════════════════════════════════════════════════════════════════
# Development Environment Overrides
# Use: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ════════════════════════════════════════════════════════════════════════════

services:
  # ──────────────────────────────────────────────────────────────────────────
  # Local Postgres seeded from latest production dump
  # ──────────────────────────────────────────────────────────────────────────
  db:
    image: postgres:17
    container_name: whatsapp_postgres_local
    restart: "no"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_dev
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../data_snapshots:/docker-entrypoint-initdb.d/snapshots:ro
      - ../docker/initdb.d/restore_prod_snapshot.sh:/docker-entrypoint-initdb.d/restore_prod_snapshot.sh:ro
      - ../docker/initdb.d/00-trust-remote.sh:/docker-entrypoint-initdb.d/00-trust-remote.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whatsapp_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - whatsapp_network
    command: >
      bash -c "
        echo '📦 Starting Postgres...';
        # Ensure pg_hba.conf allows external connections
        if [ -f /var/lib/postgresql/data/pg_hba.conf ]; then
          echo '🔧 Updating pg_hba.conf for trust authentication...';
          sed -i 's/^host all all all.*/host all all all trust/' /var/lib/postgresql/data/pg_hba.conf;
        else
          echo '⚠️ pg_hba.conf not found yet, will be created automatically by initdb.';
        fi;
        exec docker-entrypoint.sh postgres
      "
  # ──────────────────────────────────────────────────────────────────────────
  # Migration Service: Dev overrides
  # ──────────────────────────────────────────────────────────────────────────
  migrate:
    depends_on:
      - db
    build:
      target: dev
    volumes:
      - ../migrations:/app/migrations:ro
      - ../alembic.ini:/app/alembic.ini:ro
    environment:
      - RUN_MIGRATIONS=false

  # ──────────────────────────────────────────────────────────────────────────
  # Miner Service: Dev overrides with hot reload
  # ──────────────────────────────────────────────────────────────────────────
  miner:
    build:
      target: dev
    restart: "no"  # No auto-restart in dev (easier debugging)
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src:/app/src  # Hot reload: mount source code
      - ../migrations:/app/migrations:ro
    ports:
      - "8000:8000"  # Expose health endpoint for local testing
      - "${SSH_PORT_MINER:-911}:2222"  # Expose SSH port for PyCharm remote development
    environment:
      - PYTHONUNBUFFERED=1  # Real-time logs
      - DEBUG=true
      - LOG_LEVEL=DEBUG

  # ──────────────────────────────────────────────────────────────────────────
  # Classifier Service: Dev overrides with hot reload
  # ──────────────────────────────────────────────────────────────────────────
  classifier:
    build:
      target: dev
    restart: "no"  # No auto-restart in dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../src:/app/src  # Hot reload: mount source code
      - ../migrations:/app/migrations:ro
    ports:
      - "8001:8001"  # Expose health endpoint for local testing
      - "${SSH_PORT_CLASSIFIER:-912}:2222"  # Expose SSH port for PyCharm remote development
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=true
      - LOG_LEVEL=DEBUG

volumes:
  postgres_data:

