name: Deploy WhatsApp Miner

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy (stg/prod)'
        required: true
        default: 'stg'
        type: choice
        options:
          - stg
          - prod
  push:
    branches:
      - main   # deploys prod
      - stage  # deploys stg

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    # Determine environment from branch or manual input
    environment: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'stg') }}
    
    env:
      ENV_NAME: ${{ github.event.inputs.environment || (github.ref_name == 'main' && 'prod' || 'stg') }}
      AWS_REGION: ${{ secrets.AWS_EC2_REGION }}
    
    steps:
      # ═══════════════════════════════════════════════════════════════════
      # 1. Setup
      # ═══════════════════════════════════════════════════════════════════
      
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_IAM_WHATSAPP_MINER_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_IAM_WHATSAPP_MINER_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_EC2_REGION }}
      
      # ═══════════════════════════════════════════════════════════════════
      # 2. Build and Push Docker Images
      # ═══════════════════════════════════════════════════════════════════
      
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      
      - name: Build and push images (miner and classifier)
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ env.ENV_NAME }}-${{ github.sha }}
        run: |
          # Build once, tag with both miner and classifier names
          docker build \
            --target prod \
            --file docker/Dockerfile \
            --tag ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_MINER }}:$IMAGE_TAG \
            --tag ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_MINER }}:${{ env.ENV_NAME }} \
            --tag ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_CLASSIFIER }}:$IMAGE_TAG \
            --tag ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_CLASSIFIER }}:${{ env.ENV_NAME }} \
            .
          
          # Push all tags
          docker push ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_MINER }}:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_MINER }}:${{ env.ENV_NAME }}
          docker push ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_CLASSIFIER }}:$IMAGE_TAG
          docker push ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_CLASSIFIER }}:${{ env.ENV_NAME }}
          
          echo "✓ Built once and pushed as:"
          echo "  - Miner: ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_MINER }}:${{ env.ENV_NAME }}"
          echo "  - Classifier: ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_CLASSIFIER }}:${{ env.ENV_NAME }}"
      
      # ═══════════════════════════════════════════════════════════════════
      # 3. Deploy to EC2
      # ═══════════════════════════════════════════════════════════════════
      
      - name: Create environment file for remote
        run: |
          # Create .env file from GitHub Secrets (named by environment)
          cat > .env.${{ env.ENV_NAME }} <<EOF
          ENV_NAME=${{ env.ENV_NAME }}
          BUILD_TARGET=prod
          DOCKER_IMAGE_NAME_WHATSAPP_MINER=${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_MINER }}
          DOCKER_IMAGE_NAME_WHATSAPP_CLASSIFIER=${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_CLASSIFIER }}
          DOCKER_CONTAINER_NAME_WHATSAPP_MINER=${{ secrets.DOCKER_CONTAINER_NAME_WHATSAPP_MINER }}
          GREEN_API_INSTANCE_API_TOKEN=${{ secrets.GREEN_API_INSTANCE_API_TOKEN }}
          GREEN_API_INSTANCE_ID=${{ secrets.GREEN_API_INSTANCE_ID }}
          SUPABASE_DATABASE_CONNECTION_STRING=${{ secrets.SUPABASE_DATABASE_CONNECTION_STRING }}
          SUPABASE_DATABASE_CONNECTION_STRING_SESSION_POOLER=${{ secrets.SUPABASE_DATABASE_CONNECTION_STRING_SESSION_POOLER }}
          SUPABASE_DATABASE_PASSWORD=${{ secrets.SUPABASE_DATABASE_PASSWORD }}
          SUPABASE_PSQL_COMMAND=${{ secrets.SUPABASE_PSQL_COMMAND }}
          MESSAGE_CLASSIFIER_RUN_EVERY_SECONDS=${{ secrets.MESSAGE_CLASSIFIER_RUN_EVERY_SECONDS }}
          GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
          AWS_IAM_WHATSAPP_MINER_ACCESS_KEY_ID=${{ secrets.AWS_IAM_WHATSAPP_MINER_ACCESS_KEY_ID }}
          AWS_IAM_WHATSAPP_MINER_ACCESS_KEY=${{ secrets.AWS_IAM_WHATSAPP_MINER_ACCESS_KEY }}
          AWS_EC2_REGION=${{ secrets.AWS_EC2_REGION }}
          EOF
          
          echo "✓ Created .env.${{ env.ENV_NAME }}"
      
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AWS_EC2_PEM_CHATBOT_SA_B64 }}" | base64 -d > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem
          
          # Add EC2 host to known_hosts
          ssh-keyscan -H ${{ secrets.AWS_EC2_HOST_ADDRESS }} >> ~/.ssh/known_hosts
      
      - name: Copy files to EC2
        run: |
          # Create remote directory
          ssh -i ~/.ssh/deploy_key.pem \
            ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST_ADDRESS }} \
            "mkdir -p ${{ secrets.AWS_EC2_WORKING_DIRECTORY_WHATSAPP_MINER }}"
          
          # Copy docker compose files
          scp -i ~/.ssh/deploy_key.pem \
            docker/docker-compose.yml \
            docker/docker-compose.prod.yml \
            ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST_ADDRESS }}:${{ secrets.AWS_EC2_WORKING_DIRECTORY_WHATSAPP_MINER }}/
          
          # Copy helper script
          scp -i ~/.ssh/deploy_key.pem \
            scripts/docker-compose-with-env.sh \
            ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST_ADDRESS }}:${{ secrets.AWS_EC2_WORKING_DIRECTORY_WHATSAPP_MINER }}/
          
          # Copy environment file
          scp -i ~/.ssh/deploy_key.pem \
            .env.${{ env.ENV_NAME }} \
            ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST_ADDRESS }}:${{ secrets.AWS_EC2_WORKING_DIRECTORY_WHATSAPP_MINER }}/
          
          echo "✓ Files copied to remote"
      
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key.pem \
            ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST_ADDRESS }} << 'ENDSSH'
          
          cd ${{ secrets.AWS_EC2_WORKING_DIRECTORY_WHATSAPP_MINER }}
          
          echo "🚀 Starting deployment for ${{ env.ENV_NAME }}..."
          
          # Make helper script executable
          chmod +x docker-compose-with-env.sh
          
          # Login to ECR
          aws ecr get-login-password --region ${{ secrets.AWS_EC2_REGION }} | \
            docker login --username AWS --password-stdin ${{ secrets.DOCKER_IMAGE_NAME_WHATSAPP_MINER }} | head -c 100
          
          # Deploy with docker compose (pull latest images)
          ./docker-compose-with-env.sh .env.${{ env.ENV_NAME }} \
            -p whatsapp_miner_${{ env.ENV_NAME }} \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            pull
          
          # Start services (Docker auto-detects image changes and recreates only changed containers)
          ./docker-compose-with-env.sh .env.${{ env.ENV_NAME }} \
            -p whatsapp_miner_${{ env.ENV_NAME }} \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans
          
          echo "✓ Deployment complete"
          
          # Show container status
          docker ps --filter "name=whatsapp_miner_${{ env.ENV_NAME }}"
          
          # If migration failed, show migration logs
          if ! docker ps | grep -q "whatsapp_miner.*migrate.*${{ env.ENV_NAME }}"; then
            echo ""
            echo "❌ Migration container not running - checking migration logs:"
            docker compose -p whatsapp_miner_${{ env.ENV_NAME }} logs migrate 2>&1 || echo "No migration logs available"
          fi
          
          ENDSSH
      
      - name: Verify deployment
        run: |
          echo "⏳ Waiting for services to start (30s)..."
          sleep 30
          
          ssh -i ~/.ssh/deploy_key.pem \
            ${{ secrets.AWS_EC2_USERNAME }}@${{ secrets.AWS_EC2_HOST_ADDRESS }} << 'ENDSSH' || exit 1
          
          cd ${{ secrets.AWS_EC2_WORKING_DIRECTORY_WHATSAPP_MINER }}
          
          echo "🔍 Checking container health..."
          
          # Check if containers are running
          if ! docker ps | grep -q "whatsapp_miner.*_${{ env.ENV_NAME }}"; then
            echo "❌ ERROR: No whatsapp_miner containers for ${{ env.ENV_NAME }} are running"
            echo ""
            echo "Container status:"
            docker ps -a --filter "name=whatsapp_miner"
            echo ""
            echo "Migration logs (most likely cause of failure):"
            docker compose -p whatsapp_miner_${{ env.ENV_NAME }} logs migrate 2>&1 || echo "Failed to get migration logs"
            echo ""
            echo "Recent logs from miner:"
            docker compose -p whatsapp_miner_${{ env.ENV_NAME }} logs --tail 50 miner 2>&1 || echo "Failed to get miner logs"
            echo ""
            echo "Recent logs from classifier:"
            docker compose -p whatsapp_miner_${{ env.ENV_NAME }} logs --tail 50 classifier 2>&1 || echo "Failed to get classifier logs"
            exit 1
          fi
          
          # Wait for health checks (max 2 minutes)
          TIMEOUT=120
          ELAPSED=0
          
          while [ $ELAPSED -lt $TIMEOUT ]; do
            MINER_HEALTHY=$(docker ps --filter "name=whatsapp_miner_miner_${{ env.ENV_NAME }}" --format "{{.Status}}" | grep -c "healthy" || echo "0")
            CLASSIFIER_HEALTHY=$(docker ps --filter "name=whatsapp_miner_classifier_${{ env.ENV_NAME }}" --format "{{.Status}}" | grep -c "healthy" || echo "0")
            
            if [ "$MINER_HEALTHY" = "1" ] && [ "$CLASSIFIER_HEALTHY" = "1" ]; then
              echo "✅ All services are healthy!"
              docker ps --filter "name=whatsapp_miner.*_${{ env.ENV_NAME }}"
              exit 0
            fi
            
            echo "⏳ Waiting for health checks... (${ELAPSED}s/${TIMEOUT}s)"
            echo "   Miner: $([ "$MINER_HEALTHY" = "1" ] && echo "✅ healthy" || echo "❌ not healthy yet")"
            echo "   Classifier: $([ "$CLASSIFIER_HEALTHY" = "1" ] && echo "✅ healthy" || echo "❌ not healthy yet")"
            
            sleep 10
            ELAPSED=$((ELAPSED + 10))
          done
          
          # Health check timeout - show detailed error info
          echo ""
          echo "❌ ERROR: Health check timeout after ${TIMEOUT}s"
          echo ""
          echo "Container status:"
          docker ps -a --filter "name=whatsapp_miner.*_${{ env.ENV_NAME }}"
          echo ""
          echo "Miner logs (last 100 lines):"
          docker compose -p whatsapp_miner_${{ env.ENV_NAME }} logs --tail 100 miner 2>&1
          echo ""
          echo "Classifier logs (last 100 lines):"
          docker compose -p whatsapp_miner_${{ env.ENV_NAME }} logs --tail 100 classifier 2>&1
          echo ""
          echo "Migration logs:"
          docker compose -p whatsapp_miner_${{ env.ENV_NAME }} logs migrate 2>&1 || echo "No migration logs available"
          
          exit 1
          ENDSSH
      
      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key.pem
          rm -f .env.${{ env.ENV_NAME }}
